name: نشر نسخة المعاينة على GitHub Pages

# يشتغل تلقائياً مع أي push على main يلمس مجلد المعاينة، أو يدوياً من تبويب Actions
on:
  push:
    branches: [main]
    paths:
      - "maktabat-afaq-preview/**"
      - ".github/workflows/deploy-preview-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      # يرفع محتوى مجلد المعاينة فقط (مش الريبو كله) كملف Pages
      - name: تجهيز محتوى المعاينة
        uses: actions/upload-pages-artifact@v3
        with:
          path: maktabat-afaq-preview

      - name: النشر على Pages
        id: deployment
        uses: actions/deploy-pages@v4
