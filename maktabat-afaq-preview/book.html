<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكتاب — مكتبة آفاق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mkt-preview-banner">
    نسخة معاينة تصميمية — كتالوج حقيقي (40 كتاباً)، صور الأغلفة قيد الاكتمال تدريجياً
</div>

<header class="mkt-header">
    <a href="index.html" class="mkt-logo">مكتبة آفاق</a>
</header>

<div class="mkt-book-page" id="mkt-book-page">
    <!-- تُملأ عبر JavaScript حسب ?slug= في الرابط -->
</div>

<footer class="mkt-footer">© 2026 مكتبة آفاق</footer>

<script src="data.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var slug = params.get("slug") || MKT_BOOKS[0].slug;
var book = MKT_BOOKS.find(function (b) { return b.slug === slug; }) || MKT_BOOKS[0];

document.title = book.title + " — مكتبة آفاق";

var coverHTML = book.cover
    ? '<img class="mkt-book-cover" src="covers/' + book.cover + '" alt="' + book.title + '">'
    : '<div class="mkt-book-cover mkt-book-cover--empty">لا صورة</div>';

var waMessage = encodeURIComponent(
    "مرحباً، أريد طلب كتاب:\n\"" + book.title + "\"\nالناشر: " + book.publisher
);

document.getElementById("mkt-book-page").innerHTML =
    coverHTML +
    '<div>' +
        '<h1>' + book.title + '</h1>' +
        '<div class="mkt-book-meta">' +
            (book.author ? '<span>المؤلف: ' + book.author + '</span>' : '') +
            '<span>التصنيف: ' + book.category + '</span>' +
            '<span>الناشر: ' + book.publisher + '</span>' +
        '</div>' +
        '<p class="mkt-book-price" style="font-size:1.3em">' + mktPriceHTML(book) + '</p>' +
        '<a class="mkt-order-button" target="_blank" href="https://wa.me/963000000000?text=' + waMessage + '">اطلب عبر واتساب</a>' +
    '</div>';
</script>

</body>
</html>
