# docker-compose.yml — بيئة اختبار محلية لمشروع مكتبة الكتب الورقية
#
# لا يُستخدم هذا الملف في الإنتاج — الغرض الوحيد هو تشغيل الكود الموجود
# فعلياً في هذا المستودع (Plugin + Theme) على WordPress + MySQL حقيقيين
# لأول مرة، لسدّ الفجوة الوحيدة المتبقية من "تقرير حالة المشروع":
# "لم يُشغَّل أي سطر من الكود فعلياً على مفسّر PHP حتى الآن".
#
# التشغيل:
#   1) انسخ .env.example إلى .env (اختياري — القيم الافتراضية تعمل كما هي)
#   2) docker compose up -d
#   3) افتح http://localhost:8080 وأكمل معالج تثبيت WordPress
#   4) ثبّت WooCommerce ثم فعّل Maktaba Core ثم Maktaba Theme (بهذا الترتيب)
#
# إيقاف كامل مع حذف البيانات (بداية نظيفة):
#   docker compose down -v

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-maktaba}
      MYSQL_USER: ${MYSQL_USER:-maktaba}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-maktaba_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-maktaba}
      WORDPRESS_DB_USER: ${MYSQL_USER:-maktaba}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-maktaba_pass}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 1
      # يُظهر أخطاء PHP في الصفحة مباشرة أثناء التطوير فقط —
      # يُعطَّل هذا السطر (أو يُحذف) قبل أي استخدام إنتاجي فعلي.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
    volumes:
      - wp_core:/var/www/html
      # ربط مباشر (Bind Mount) لكود المشروع الفعلي من هذا المستودع —
      # أي تعديل تجريه هنا (أو أرسله لي لاحقاً) ينعكس فوراً بلا إعادة بناء
      - ./wp-content/plugins/maktaba-core:/var/www/html/wp-content/plugins/maktaba-core
      - ./wp-content/themes/maktaba-theme:/var/www/html/wp-content/themes/maktaba-theme

  # خدمة WP-CLI — لا تُشغَّل تلقائياً مع "docker compose up" (profile منفصل).
  # الصورة الرسمية wordpress:php8.2-apache لا تتضمن wp-cli، لذا نستخدم
  # صورة wordpress:cli الرسمية المخصصة لهذا الغرض، بنفس الشبكة وبنفس
  # مجلد ووردبريس (wp_core) لتعمل على نفس الموقع وقاعدة البيانات تماماً.
  # التشغيل: docker compose run --rm wpcli wp <أمر>
  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-maktaba}
      WORDPRESS_DB_USER: ${MYSQL_USER:-maktaba}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-maktaba_pass}
      # يُسكِت تحذير "Permission denied" غير الضار عند تثبيت إضافات —
      # wp-cli يحاول الكتابة إلى ~/.wp-cli/cache افتراضياً، وهذا المسار
      # غير قابل للكتابة لمستخدم الحاوية (33:33)؛ /tmp دائماً قابل للكتابة.
      WP_CLI_CACHE_DIR: /tmp/wpcli-cache
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/plugins/maktaba-core:/var/www/html/wp-content/plugins/maktaba-core
      - ./wp-content/themes/maktaba-theme:/var/www/html/wp-content/themes/maktaba-theme
      - ./docker/wp-cli-scripts:/scripts
    user: "33:33"

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER:-maktaba}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-maktaba_pass}
    # هذه الخدمة اختيارية بالكامل — لفحص الجداول المخصصة
    # (mkt_inventory_movements / mkt_purchase_items / mkt_customers) بصرياً.
    # لحذفها: احذف هذا القسم بالكامل أو نفّذ:
    #   docker compose up -d db wordpress   (بلا phpmyadmin)

volumes:
  db_data:
  wp_core:
